[versions]
# 0.12 is the last release on Ktor 3.3 and Kotlin 2.3, which the rest of the build uses.
mcp-kotlin = "0.12.0"
agp = "9.1.0"
android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"
androidx-activity = "1.12.2"
androidx-appcompat = "1.7.1"
androidx-core = "1.17.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.9.6"
androidx-testExt = "1.3.0"
androidx-testCore = "1.6.1"
composeHotReload = "1.0.0"
composeMultiplatform = "1.10.0"
junit = "4.13.2"
robolectric = "4.16"
kotlin = "2.3.0"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1"
kotlinx-serialization = "1.9.0"
ktor = "3.3.3"
jsoup = "1.18.3"
jspecify = "1.0.0"
navigationevent = "1.0.1"
playwright = "1.51.0"
logback = "1.5.24"
onnxruntime = "1.23.2"
coil = "3.2.0"
kotlinx-browser = "0.5.0"
material3 = "1.10.0-alpha05"
androidx-work = "2.10.1"

[libraries]
mcp-kotlin-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp-kotlin" }
