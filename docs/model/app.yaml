# The app described as data: every view, what it shows, what can be done there, what states it can
# be in, and what is missing. The browsable site is generated from this file, so the model and the
# code stay in one repository and change together.
#
# Conventions
#   tier 1  the canvas — needed on every visit
#   tier 2  one tap away — needed on some visits
#   tier 3  on request — diagnostic or rare
#   status  MISSING (not built), BROKEN (built, does not work), OK (omitted when fine)

meta:
  name: Arbay
  one_line: Search every second-hand market at once and see what is worth buying.
  markets: 27

views:
  - id: home
    name: Home
    purpose: Show the searches worth coming back to, and start a new one.
    screenshot: composeApp/build/gallery/home-light.png
    shows:
      - { what: "Saved searches, each with its market count", tier: 1 }
      - { what: "Free Items summary, when a profile exists", tier: 1 }
    actions:
      - { what: "Open a saved search", goes_to: results }
      - { what: "Edit a saved search", goes_to: car_search, note: "vehicle searches; others open the add sheet" }
      - { what: "Delete a saved search" }
      - { what: "Start a search", goes_to: discovery }
      - { what: "Settings", goes_to: settings }
    gaps:
      - { what: "Nothing says whether background re-crawling is on, when it last ran, or what it found", status: MISSING }
      - { what: "A saved search does not show when it last found something new", status: MISSING }

  - id: discovery
    name: Search
    purpose: Get from an idea to a search, by typing or by browsing categories.
    screenshot: composeApp/build/gallery/search-light.png
    shows:
      - { what: "Category tiles, with vehicle search first", tier: 1 }
      - { what: "Matches from the product catalogue while typing", tier: 1 }
    actions:
      - { what: "Search the markets for what was typed", goes_to: results }
      - { what: "Pick a catalogue product", goes_to: results }
      - { what: "Vehicle search", goes_to: car_search }
      - { what: "Free items", goes_to: free_items }
    gaps:
      - what: "Category defaults search 5 vehicle markets; a live vehicle search uses 25"
        status: BROKEN
        note: "Two different notions of 'all markets' — a search from a tile is quietly narrower."

  - id: results
    name: Results
    purpose: Show what is for sale, cheapest and most relevant first, from every market at once.
    screenshot: composeApp/build/gallery/results-light.png
    reached_from: [home, discovery, car_search]
    shows:
      - { what: "Each offer: photo, title, price, market, place, age of the ad", tier: 1 }
      - { what: "One price figure — the cheapest", tier: 1 }
      - { what: "A thin progress line while markets still answer, which removes itself", tier: 1 }
      - { what: "One control saying how many filters are active", tier: 2 }
    actions:
      - { what: "Open the offer on the market's own site" }
      - { what: "Block a word, hiding every offer whose title carries it", persists_into: "saved search" }
      - { what: "Hide one offer for good", persists_into: "this device" }
      - { what: "Filters: price band, markets, countries, sort, blocked words", goes_to: filters }
      - { what: "Save the search", persists_into: "saved search" }
      - { what: "Price detail: median, spread, distribution, sold history", goes_to: price_detail }
      - { what: "Market detail: which markets, with which term, and what each answered", goes_to: market_detail, status: MISSING }
    states:
      - { id: searching, when: "Some markets have not answered", shows: "Results so far, plus the progress line" }
      - { id: partial, when: "Some markets failed, timed out, were blocked, or hit a captcha", gap: "Nothing says which failed or why; the count is simply smaller" }
      - { id: empty_after_filter, when: "Results exist but the filters admit none" }
      - { id: empty, when: "No market returned anything" }
      - { id: captcha, when: "A market offers its captcha", shows: "A link into the crawler's own browser session" }
    gaps:
      - { what: "The header count is pre-filter and the chip count is post-filter, and nothing says so", status: BROKEN }
      - { what: "Sort order is forgotten when the view closes", status: MISSING }
      - { what: "The New/Used filter is forgotten too", status: MISSING }
      - { what: "The price band only persists once the search is saved", status: MISSING }

  - id: filters
    name: Filters
    purpose: Narrow the search without losing the results.
    status: MISSING
    note: >
      Does not exist yet. Today the price band, market chips and blocked words are laid out on the
      results canvas, and vehicle filters live in the search form, which re-runs the search.
    shows:
      - { what: "Price band" }
      - { what: "Markets, grouped by country" }
      - { what: "Countries", status: MISSING, note: "Every market carries a country; nothing uses it" }
      - { what: "Blocked words" }
      - { what: "Sort order" }
    open_questions:
      - "Filtering by market: over the results already fetched, or re-run the search? Today chips do
         the first and the search form does the second, and nothing says which is which."

  - id: market_detail
    name: Markets
    purpose: Say what actually happened at each market.
    status: MISSING
    note: >
      All of this is collected today and none of it is shown: per-market status, the error and its
      kind, which fetch tier answered, the raw count before filtering, and queryUsed — the term
      actually sent, which is translated per market.
    shows:
      - { what: "Per market: the term sent, results kept, results before filtering, and what went wrong" }
      - { what: "Which markets are cooling down after a block, and for how long" }
    open_questions:
      - "Should the term sent to a market be correctable, not just visible?"

  - id: price_detail
    name: Price
    purpose: Say whether a price is good.
    status: MISSING
    note: "Today the median, the spread, the New/Used split and the chart all sit on the canvas."
    shows:
      - { what: "Median, spread, distribution" }
      - { what: "Sold history, where a market exposes it (eBay only)" }

  - id: car_search
    name: Vehicle search
    purpose: Describe a vehicle precisely enough that the markets can be asked properly.
    screenshot: composeApp/build/gallery/car-search-light.png
    shows:
      - { what: "Make and model, searchable", tier: 1 }
      - { what: "More filters: year, mileage, price, power, gearbox, fuel, body, condition, drivetrain, doors, seats, emission class, seller, van length and height, colour", tier: 2 }
      - { what: "A free-text description of the ideal vehicle, used to rank rather than filter", tier: 2 }
      - { what: "Markets", tier: 2 }
    actions:
      - { what: "Show results", goes_to: results }

  - id: free_items
    name: Free items
    purpose: Sift things being given away, learning what is worth a detour.
    screenshot: composeApp/build/gallery/free-items-light.png
    shows:
      - { what: "One item at a time, with a relevance score", tier: 1 }
      - { what: "Saved items, history, and how the model is doing", tier: 3 }
    actions:
      - { what: "Swipe: love, like, pass" }
      - { what: "Set the area and what interests you" }
      - { what: "Turn on background watching" }

  - id: settings
    name: Settings
    purpose: Point the app at its server and set how deeply it searches.
    screenshot: composeApp/build/gallery/settings-light.png
    shows:
      - { what: "Server address, with a connection test" }
      - { what: "Display currency" }
      - { what: "Search depth" }
      - { what: "Free-item alerts" }
    gaps:
      - { what: "The chosen currency is forgotten when the app restarts", status: BROKEN }
      - { what: "Search depth and alert settings are one shared setting on the server, not this device's", status: BROKEN }

# Things true of the whole app rather than one view.
across_the_app:
  - what: "Every market's country is known and nothing can be filtered by it"
    status: MISSING
  - what: "Two markets have working crawlers but appear in no list, so they can only be reached by hand"
    status: BROKEN
    detail: "Idealo's sibling Geizhals, and ImmoScout24"
  - what: "AutoScout24 Switzerland is offered as a market and has no crawler at all"
    status: BROKEN
  - what: "The server tells the app twelve kinds of failure; the app shows four"
    status: MISSING
  - what: "Background re-crawling of saved searches exists, sends alerts, and has no screen"
    status: MISSING
